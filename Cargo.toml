[package]
name = "takolisp"
version = "0.1.0"
edition = "2024"

[lib]
name = "takolisp"
path = "src/lib.rs"

[[bin]]
name = "takolisp"
path = "src/main.rs"
required-features = ["repl", "cli"]

[dependencies]
bumpalo = { version = "3.20.3", features = ["collections"] }
smallvec = "1.16.0"
anyhow = { version = "1", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
rustyline = { version = "17.0.0", optional = true }

[features]
default = ["repl", "cli"]
cli = ["dep:clap"]
repl = ["dep:anyhow", "dep:rustyline"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "vm"
harness = false
